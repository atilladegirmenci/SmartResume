<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCV</title>
    <base href="/" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="css/themes.css" rel="stylesheet" />
<link href="SmartResume.Client.styles.css" rel="stylesheet" />
<link href="css/app.css" rel="stylesheet" />
    <script>
        /* Tema flash önleme — CSS yüklenmeden önce çalışır */
        (function () {
            var t = localStorage.getItem('smartcv-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        /* PDF helpers */
        window.downloadFileFromStream = async (fileName, ref) => {
            const buf = await ref.arrayBuffer();
            const url = URL.createObjectURL(new Blob([buf], { type: 'application/pdf' }));
            window.open(url, '_blank');
        };
        window.createPdfUrl = async (ref) => {
            const buf = await ref.arrayBuffer();
            return URL.createObjectURL(new Blob([buf], { type: 'application/pdf' }));
        };
        window.revokeUrl = (url) => URL.revokeObjectURL(url);

        /* Theme manager */
        window.themeManager = {
            init: function () {
                var t = localStorage.getItem('smartcv-theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
                return t;
            },
            set: function (theme) {
                localStorage.setItem('smartcv-theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
            },
            get: function () {
                return localStorage.getItem('smartcv-theme') || 'dark';
            }
        };

        /* Geolocation */
        window.getGeolocation = function () {
            return new Promise(function (resolve, reject) {
                if (!navigator.geolocation) { reject('not supported'); return; }
                navigator.geolocation.getCurrentPosition(
                    function (p) { resolve({ latitude: p.coords.latitude, longitude: p.coords.longitude }); },
                    function () { reject('denied'); }
                );
            });
        };
    </script>
</body>
</html>
